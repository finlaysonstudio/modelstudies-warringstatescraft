name: Deploy Sandbox

# The infrastructure alone. The site's content is the snapshot in `var/`,
# which is git-ignored and lives on the workstation that ran the bench, so the
# sync is `npm run submission && npm run submission:publish` from there. This
# workflow makes the bucket and distribution the sync lands on.
#
# Variables. Repository scoped, the same in every environment:
#   AWS_HOSTED_ZONE       modelstudies.com
#   PROJECT_KEY           warringstates
# Environment scoped (`sandbox`), because each environment answers differently:
#   AWS_ROLE_ARN          role this workflow assumes, GitHub OIDC
#   AWS_REGION            default us-east-1
#   PROJECT_ENV           sandbox
#   PROJECT_NONCE         eight characters, set once and never changed; the
#                         deploy refuses to run without it
#   DATADOG_API_KEY_ARN   reserved; nothing in this stack reads it yet

on:
  workflow_dispatch:
    inputs:
      diff-only:
        description: Print the diff and stop
        required: false
        type: boolean
        default: false

concurrency:
  group: deploy-sandbox
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Deploy submission site
    runs-on: ubuntu-latest
    environment: sandbox
    # `environment: sandbox` above is what lets this block read the
    # environment-scoped variables; without it they resolve empty.
    env:
      PROJECT_ENV: ${{ vars.PROJECT_ENV || 'sandbox' }}
      PROJECT_SPONSOR: ${{ vars.PROJECT_SPONSOR || 'modelstudies' }}
      PROJECT_KEY: ${{ vars.PROJECT_KEY || 'warringstates' }}
      CDK_ENV_HOSTED_ZONE: ${{ vars.AWS_HOSTED_ZONE }}
      CDK_ENV_REPO: ${{ github.repository }}
      CDK_ENV_LOG: "true"
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # The nonce is half the stack's name, so a deploy that invents one
      # deploys beside the stack that is already there rather than updating
      # it. There is no safe default: bail and let a person set the variable.
      - name: Require project nonce
        id: project
        shell: bash
        env:
          INPUT_PROJECT_NONCE: ${{ vars.PROJECT_NONCE }}
        run: |
          if [[ -z "${INPUT_PROJECT_NONCE}" ]]; then
            echo "::error::PROJECT_NONCE is not set on the ${PROJECT_ENV} environment."
            echo "Set it once, to eight lowercase alphanumerics, and never change it:"
            echo "  gh variable set PROJECT_NONCE -R ${GITHUB_REPOSITORY} -e ${PROJECT_ENV} -b <nonce>"
            exit 1
          fi
          if [[ ! "${INPUT_PROJECT_NONCE}" =~ ^[a-z0-9]{8}$ ]]; then
            echo "::error::PROJECT_NONCE must be eight lowercase alphanumerics, read '${INPUT_PROJECT_NONCE}'."
            exit 1
          fi
          echo "PROJECT_NONCE=${INPUT_PROJECT_NONCE}" >> "$GITHUB_ENV"
          echo "PROJECT_NONCE=${INPUT_PROJECT_NONCE}"

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Diff
        run: npm run diff --workspace @modelstudies/chinatalk-submission-2026

      - name: Deploy
        if: ${{ !inputs.diff-only }}
        run: |
          npm run cdk --workspace @modelstudies/chinatalk-submission-2026 -- \
            deploy --require-approval never SubmissionSiteStack
